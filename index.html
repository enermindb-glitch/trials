<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Player Registration | CPL</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="card">
  <h1>Player Registration</h1>
  <p class="subtitle">Create your CPL player profile</p>

  <form id="regForm">
    <label for="image">Profile Image</label>
    <input type="file" id="image" accept="image/*" />
    <img id="preview" class="avatar-preview" style="display:none" />

    <label for="name">Full Name</label>
    <input type="text" id="name" required />

    <label for="email">Email</label>
    <input type="email" id="email" required />

    <label for="password">Password</label>
    <input type="password" id="password" required minlength="6" />

    <label for="confirmPassword">Confirm Password</label>
    <input type="password" id="confirmPassword" required minlength="6" />

    <button type="submit" id="submitBtn">Register</button>
    <div id="msg" class="msg"></div>
  </form>

  <div class="links">
    Already have an account? <a href="login.html">Log in</a>
  </div>
</div>

<script src="config.js"></script>
<script>
const form = document.getElementById('regForm');
const msg = document.getElementById('msg');
const submitBtn = document.getElementById('submitBtn');
const imageInput = document.getElementById('image');
const preview = document.getElementById('preview');

imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if (file) {
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = '';
  msg.className = 'msg';

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (password !== confirmPassword) {
    msg.textContent = 'Passwords do not match.';
    msg.classList.add('error');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span>Registering...';

  try {
    const imageBase64 = await fileToBase64(imageInput.files[0]);
    const result = await callApi('register', { name, email, password, image: imageBase64 });

    if (result.ok) {
      setSession(result.profile);
      msg.textContent = 'Registered! Your CPL number is ' + result.profile.CPLNumber + '. Redirecting...';
      msg.classList.add('success');
      setTimeout(() => { window.location.href = 'profile.html'; }, 1500);
    } else {
      msg.textContent = result.error || 'Registration failed.';
      msg.classList.add('error');
    }
  } catch (err) {
    msg.textContent = 'Network error: ' + err.message;
    msg.classList.add('error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Register';
  }
});
</script>
</body>
</html>
