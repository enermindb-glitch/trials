<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login | Chuka Premier League</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site">
  <div class="logo-mark">CPL</div>
  <div class="brand">
    <strong>Chuka Premier League</strong>
    <span>Player Portal</span>
  </div>
  <nav>
    <a href="index.html">Register</a>
    <a href="login.html" aria-current="page">Login</a>
  </nav>
</header>

<main class="narrow">
  <span class="eyebrow">Spec 02 — Access</span>
  <h1>Player Login</h1>
  <p>Log in with your name, email, or CPL number.</p>

  <div class="panel">
    <form id="loginForm">
      <label for="loginId">Name / Email / CPL Number</label>
      <input type="text" id="loginId" placeholder="e.g. CPL00001" required />

      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" required />
        <button type="button" class="pw-toggle" data-target="password">Show</button>
      </div>

      <button type="submit" id="submitBtn">Log In</button>
      <div id="msg" class="msg"></div>
    </form>
  </div>

  <p style="text-align:center;">New player? <a href="index.html">Register here</a></p>
</main>

<footer>Chuka Premier League &mdash; Player Registry System</footer>

<script src="config.js"></script>
<script>
const form = document.getElementById('loginForm');
const msg = document.getElementById('msg');
const submitBtn = document.getElementById('submitBtn');

document.querySelectorAll('.pw-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = document.getElementById(btn.dataset.target);
    const isHidden = target.type === 'password';
    target.type = isHidden ? 'text' : 'password';
    btn.textContent = isHidden ? 'Hide' : 'Show';
  });
});

function showMsg(text, ok) {
  msg.textContent = text;
  msg.className = 'msg show ' + (ok ? 'ok' : 'err');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';

  const loginId = document.getElementById('loginId').value.trim();
  const password = document.getElementById('password').value;

  submitBtn.disabled = true;
  submitBtn.textContent = 'Logging in...';

  try {
    const result = await callApi('login', { loginId, password });
    if (result.ok) {
      setSession(result.profile);
      showMsg('Welcome back, ' + result.profile.Name + '! Redirecting...', true);
      setTimeout(() => { window.location.href = 'profile.html'; }, 1000);
    } else {
      showMsg(result.error || 'Login failed.', false);
    }
  } catch (err) {
    showMsg('Network error: ' + err.message, false);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Log In';
  }
});
</script>
</body>
</html>
