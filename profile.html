<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile | Chuka Premier League</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site">
  <div class="logo-mark">CPL</div>
  <div class="brand">
    <strong>Chuka Premier League</strong>
    <span>Player Portal</span>
  </div>
  <nav>
    <a href="profile.html" aria-current="page">Profile</a>
    <a href="#" id="logoutLink">Log Out</a>
  </nav>
</header>

<main class="narrow">
  <span class="eyebrow">Spec 03 — Player Record</span>
  <h1>My Profile</h1>
  <p>View your player record and update your details or profile photo.</p>

  <div class="panel">
    <div class="player-header">
      <div class="avatar-upload" id="avatarUpload" title="Click to change photo">
        <img id="photo" class="photo" alt="Profile photo" style="display:none;" />
        <div id="photoFallback" class="avatar-fallback">?</div>
        <div class="avatar-edit-badge">Change</div>
      </div>
      <input type="file" id="image" accept="image/*" style="display:none;" />
      <div class="meta">
        <div class="cpl-number" id="cplBadge">CPL Number: —</div>
        <div id="metaName" style="color:var(--muted);font-size:0.9rem;"></div>
        <div id="photoHint" style="color:var(--muted);font-size:0.78rem;margin-top:6px;">Click your photo to upload a new one.</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <form id="profileForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="newPassword">New Password <span class="opt">(leave blank to keep current)</span></label>
      <div class="pw-wrap">
        <input type="password" id="newPassword" minlength="6" placeholder="At least 6 characters" />
        <button type="button" class="pw-toggle" data-target="newPassword">Show</button>
      </div>

      <label for="currentPassword">Current Password <span class="opt">(required to save)</span></label>
      <div class="pw-wrap">
        <input type="password" id="currentPassword" required />
        <button type="button" class="pw-toggle" data-target="currentPassword">Show</button>
      </div>

      <button type="submit" id="submitBtn">Save Changes</button>
      <button type="button" class="btn secondary" id="logoutBtn">Log Out</button>
      <div id="msg" class="msg"></div>
    </form>
  </div>
</main>

<style>
  .avatar-upload{position:relative;cursor:pointer;width:120px;height:120px;flex:0 0 auto;}
  .avatar-upload .photo,.avatar-upload .avatar-fallback{width:120px;height:120px;}
  .avatar-edit-badge{
    position:absolute;bottom:0;left:0;right:0;
    background:rgba(11,27,43,0.85);
    color:var(--gold);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.62rem;letter-spacing:0.05em;text-transform:uppercase;
    text-align:center;padding:4px 0;
    border-bottom-left-radius:50%;border-bottom-right-radius:50%;
    opacity:0;transition:opacity .15s ease;
  }
  .avatar-upload:hover .avatar-edit-badge{opacity:1;}
</style>

<footer>Chuka Premier League &mdash; Player Registry System</footer>

<script src="config.js"></script>
<script>
const session = getSession();
if (!session) {
  window.location.href = 'login.html';
}

const form = document.getElementById('profileForm');
const msg = document.getElementById('msg');
const submitBtn = document.getElementById('submitBtn');
const imageInput = document.getElementById('image');
const avatarUpload = document.getElementById('avatarUpload');
const photo = document.getElementById('photo');
const photoFallback = document.getElementById('photoFallback');
const photoHint = document.getElementById('photoHint');
const cplBadge = document.getElementById('cplBadge');
const metaName = document.getElementById('metaName');
const nameInput = document.getElementById('name');

let pendingImageBase64 = ''; // set once a new photo is picked, cleared after save

function fillForm(p) {
  cplBadge.textContent = 'CPL Number: ' + p.CPLNumber;
  metaName.textContent = p.Name + ' — ' + p.Email;
  nameInput.value = p.Name || '';
  document.getElementById('email').value = p.Email || '';

  if (p.ImageUrl) {
    photo.src = p.ImageUrl;
    photo.style.display = 'block';
    photoFallback.style.display = 'none';
  } else {
    photo.style.display = 'none';
    photoFallback.style.display = 'flex';
    photoFallback.textContent = (p.Name || '?').charAt(0).toUpperCase();
  }
}

fillForm(session);

// Refresh from server in case data changed elsewhere
(async () => {
  const result = await callApi('getProfile', { cplNumber: session.CPLNumber });
  if (result.ok) {
    setSession(result.profile);
    fillForm(result.profile);
  }
})();

avatarUpload.addEventListener('click', () => imageInput.click());

imageInput.addEventListener('change', async () => {
  const file = imageInput.files[0];
  if (!file) return;
  pendingImageBase64 = await fileToBase64(file);
  photo.src = URL.createObjectURL(file);
  photo.style.display = 'block';
  photoFallback.style.display = 'none';
  photoHint.textContent = 'New photo selected — click "Save Changes" below to apply it.';
  photoHint.style.color = 'var(--gold)';
});

document.querySelectorAll('.pw-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = document.getElementById(btn.dataset.target);
    const isHidden = target.type === 'password';
    target.type = isHidden ? 'text' : 'password';
    btn.textContent = isHidden ? 'Hide' : 'Show';
  });
});

function showMsg(text, ok) {
  msg.textContent = text;
  msg.className = 'msg show ' + (ok ? 'ok' : 'err');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';

  const name = nameInput.value.trim();
  const email = document.getElementById('email').value.trim();
  const newPassword = document.getElementById('newPassword').value;
  const currentPassword = document.getElementById('currentPassword').value;

  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving...';

  try {
    const payload = { cplNumber: session.CPLNumber, currentPassword, name, email };
    if (newPassword) payload.newPassword = newPassword;
    if (pendingImageBase64) payload.image = pendingImageBase64;

    const result = await callApi('updateProfile', payload);
    if (result.ok) {
      setSession(result.profile);
      fillForm(result.profile);
      imageInput.value = '';
      pendingImageBase64 = '';
      photoHint.textContent = 'Click your photo to upload a new one.';
      photoHint.style.color = 'var(--muted)';
      document.getElementById('currentPassword').value = '';
      document.getElementById('newPassword').value = '';
      showMsg('Profile updated successfully.', true);
    } else {
      showMsg(result.error || 'Update failed.', false);
    }
  } catch (err) {
    showMsg('Network error: ' + err.message, false);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Save Changes';
  }
});

function doLogout(e) {
  if (e) e.preventDefault();
  clearSession();
  window.location.href = 'login.html';
}
document.getElementById('logoutBtn').addEventListener('click', doLogout);
document.getElementById('logoutLink').addEventListener('click', doLogout);
</script>
</body>
</html>
